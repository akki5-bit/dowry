<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Wedding Dowry Calculator | शादी का दहेज कैलकुलेटर</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .floating-mandap {
            position: fixed;
            top: 10%;
            right: 5%;
            font-size: 4rem;
            animation: float 6s ease-in-out infinite;
            z-index: 10;
            opacity: 0.8;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .rangoli {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: radial-gradient(circle at 50% 50%, #ff6b35, #f7931e, #ffd23f, transparent);
            opacity: 0.6;
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            background: linear-gradient(45deg, #d63031, #fdcb6e, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px #fff); }
            to { filter: drop-shadow(0 0 40px #ff6b6b); }
        }

        .subtitle {
            font-size: 1.5rem;
            color: white;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .get-started-btn {
            padding: 20px 50px;
            font-size: 1.8rem;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(231, 76, 60, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .get-started-btn:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 25px 50px rgba(231, 76, 60, 0.6);
        }

        .get-started-btn:active {
            transform: translateY(-5px) scale(1.02);
        }

        .btn-decoration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1.2rem; }
            .get-started-btn { padding: 18px 40px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="floating-mandap">🏺✨</div>
    
    <div class="container">
        <h1>💍 शादी का दहेज कैलकुलेटर 💰</h1>
        <p class="subtitle">Calculate Perfect Dowry for Your Dream Wedding! ✨</p>
        
        <button class="get-started-btn" onclick="startCalculator()">
            🚀 Get Started Now ✨
        </button>
    </div>

    <div class="rangoli"></div>

    <script>
        function startCalculator() {
            window.location.href = 'calculator.html';
        }

        // Auto fireworks effect
        setInterval(() => {
            const firework = document.createElement('div');
            firework.style.cssText = `
                position: fixed;
                width: 6px; height: 6px;
                background: #ff6b6b;
                border-radius: 50%;
                left: ${Math.random() * 100}vw;
                top: ${Math.random() * 50}vh;
                animation: firework 2s ease-out forwards;
                z-index: 20;
                pointer-events: none;
            `;
            document.body.appendChild(firework);
            
            setTimeout(() => firework.remove(), 2000);
        }, 2000);

        // Add firework CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes firework {
                0% { transform: scale(0) translateY(0); opacity: 1; }
                100% { transform: scale(1) translateY(-100vh); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
